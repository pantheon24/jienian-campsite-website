  <!-- 果園：樹叢＋果實（白步道左側） -->
  <g>
    <use href="#tree" x="292" y="106" width="32" height="39"/>
    <use href="#tree" x="322" y="96" width="32" height="39"/>
    <use href="#tree" x="306" y="140" width="30" height="37"/>
    <g fill="#E06B4B"><circle cx="306" cy="140" r="3.2"/><circle cx="330" cy="128" r="3.2"/><circle cx="320" cy="154" r="3.2"/></g>
  </g>

