<svg viewBox="0 0 1182 642" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉恩典山丘營區配置圖（依官方配置圖描繪）：入口在左下角，道路由入口沿下緣進場並繞行右側與上緣。左至右、下至上分佈 E 區、D 區、C 區、B 區、營本部、A1／A2／A5／A6 區與森林步道、樹林；中上為果園、小動物區、景觀池。淺綠為草坡、深綠為林地與坡崁、灰為道路與停車場；粉紅點為插座、褐點為洗水槽。">
  <defs>
    <path id="land" d="M180,100 C240,82 320,90 400,86 C480,82 560,76 640,80 C710,82 760,88 792,104
      C840,112 884,140 894,180 C906,224 900,270 882,300 C902,336 906,392 882,436 C862,478 818,512 762,522
      C690,536 560,542 420,540 C300,538 200,548 140,540 C96,532 74,486 72,432 C60,388 66,340 88,344
      C66,300 66,232 76,192 C86,150 120,112 180,100 Z"/>
    <clipPath id="landClip"><use href="#land"/></clipPath>

    <pattern id="mow" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <rect width="30" height="30" fill="none"/>
      <rect width="30" height="15" fill="#3d6b2e" opacity="0.045"/>
    </pattern>

    <symbol id="tree" viewBox="0 0 40 48">
      <rect x="17.5" y="33" width="4.6" height="13" rx="1.6" fill="#8a5a33"/>
      <circle cx="14" cy="24" r="11" fill="#6fa24c"/>
      <circle cx="26" cy="22" r="12" fill="#7cb257"/>
      <circle cx="20" cy="14" r="10" fill="#8cc266"/>
      <circle cx="16.5" cy="18" r="4.4" fill="#a6d484" opacity=".75"/>
    </symbol>
    <symbol id="pine" viewBox="0 0 32 48">
      <rect x="14" y="37" width="4" height="10" rx="1.3" fill="#7a5230"/>
      <path d="M16 3 L27 22 L5 22 Z" fill="#5f9445"/>
      <path d="M16 13 L29 35 L3 35 Z" fill="#6ea251"/>
      <path d="M16 23 L31 45 L1 45 Z" fill="#7cb15c"/>
    </symbol>
    <symbol id="toilet" viewBox="0 0 36 40">
      <rect x="4" y="14" width="28" height="24" rx="3" fill="#FFFDF6" stroke="#C9BE9E" stroke-width="1.5"/>
      <path d="M1.5 15.5 L18 3 L34.5 15.5 Z" fill="#C4623E"/>
      <circle cx="13" cy="24" r="2.8" fill="#3b3b3b"/>
      <path d="M13 27c-2.6 0-3.5 2.6-3.5 5.4V37h7v-4.6C16.5 29.6 15.6 27 13 27z" fill="#3b3b3b"/>
      <circle cx="23" cy="24" r="2.8" fill="#C4623E"/>
      <path d="M23 27c-2.4 0-3.2 2.4-3.2 5V37h6.4v-5c0-2.6-.8-5-3.2-5z" fill="#C4623E"/>
    </symbol>
    <symbol id="hq" viewBox="0 0 108 74">
      <ellipse cx="55" cy="70" rx="46" ry="5" fill="#000000" opacity=".12"/>
      <rect x="16" y="34" width="76" height="34" fill="#F4EEE1" stroke="#D3C7AC" stroke-width="1.6"/>
      <path d="M8 36 L54 10 L100 36 Z" fill="#3f4a58"/>
      <g stroke="#5b6675" stroke-width="1.2" opacity=".9">
        <line x1="20" y1="34" x2="54" y2="14"/><line x1="34" y1="34" x2="62" y2="18"/>
        <line x1="48" y1="34" x2="72" y2="20"/><line x1="66" y1="34" x2="82" y2="24"/>
        <line x1="84" y1="34" x2="92" y2="30"/>
      </g>
      <rect x="26" y="44" width="15" height="18" fill="#8FB0C4"/>
      <rect x="54" y="42" width="16" height="26" fill="#C4623E"/>
      <rect x="76" y="46" width="10" height="12" fill="#8FB0C4"/>
    </symbol>
    <symbol id="shelter" viewBox="0 0 90 62">
      <ellipse cx="45" cy="57" rx="38" ry="4" fill="#000000" opacity=".1"/>
      <path d="M45 6 L84 28 L45 50 L6 28 Z" fill="#8A9BB0"/>
      <path d="M6 28 L45 50 L45 58 L6 36 Z" fill="#6C7D92"/>
      <path d="M84 28 L45 50 L45 58 L84 36 Z" fill="#5E6E82"/>
    </symbol>
    <symbol id="pp" viewBox="0 0 28 28">
      <circle cx="14" cy="14" r="12.5" fill="#5F8CA3" stroke="#FFFDF6" stroke-width="2"/>
      <text x="14" y="19.5" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-weight="800" font-size="16" fill="#FFFDF6">P</text>
    </symbol>
    <symbol id="stairs" viewBox="0 0 32 32">
      <path d="M3 28 L3 22 L11 22 L11 15 L19 15 L19 8 L27 8 L27 2" fill="none" stroke="#5b6b4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3 28 L3 22 L11 22 L11 15 L19 15 L19 8 L27 8 L27 2" fill="none" stroke="#F4F0E2" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="pitch" viewBox="0 0 14 20">
      <path d="M7 1 C4.5 6 1 9.5 1 13.2 A6 6 0 0 0 13 13.2 C13 9.5 9.5 6 7 1 Z" fill="#DE6BA0"/>
      <ellipse cx="4.8" cy="12" rx="1.5" ry="2.3" fill="#F0A6CA" opacity=".55"/>
    </symbol>
    <symbol id="sink" viewBox="0 0 14 20">
      <path d="M7 1 C4.5 6 1 9.5 1 13.2 A6 6 0 0 0 13 13.2 C13 9.5 9.5 6 7 1 Z" fill="#8a5a33"/>
      <ellipse cx="4.8" cy="12" rx="1.5" ry="2.3" fill="#b98a5e" opacity=".55"/>
    </symbol>
    <symbol id="goose" viewBox="0 0 26 24">
      <ellipse cx="14" cy="16" rx="8" ry="6" fill="#FFFFFF" stroke="#D8CBA6" stroke-width="1"/>
      <path d="M8 13 C5 11 6 4 9 4 C11 4 11 9 10 13 Z" fill="#FFFFFF" stroke="#D8CBA6" stroke-width="1"/>
      <circle cx="9" cy="5.5" r="1.2" fill="#333"/>
      <path d="M7 6.5 L3.5 6.5" stroke="#E8A33C" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="compass" viewBox="0 0 44 44">
      <circle cx="22" cy="22" r="13" fill="#FFFDF6" stroke="#8a8a80" stroke-width="1.6"/>
      <path d="M22 6 L22 12 M22 32 L22 38 M6 22 L12 22 M32 22 L38 22" stroke="#8a8a80" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M31 22 L37 20 L37 24 Z" fill="#C4623E"/>
    </symbol>
