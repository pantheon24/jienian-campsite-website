  <!-- ================= 描圖底圖：微調時把 opacity 調成 0.4，完成後整行刪除 ================= -->
  <image href="layout.png" x="0" y="0" width="1182" height="642" opacity="0"/>

  <!-- ================= 地形 ================= -->
  <use href="#land" fill="#C6E0A2"/>

  <g clip-path="url(#landClip)">
    <!-- ===========================================================
         色塊規則（互不重疊、互不覆蓋）：
         灰 = 汽車可行駛：停車場該層整片＋最下方入口道路＋各層轉進來的小段
         深綠 = 斜坡／圍籬，人不可行走，只作各層分隔
         淺綠 = 可行走草地（底色）
         =========================================================== -->

    <!-- ── 灰：停車場（該層整片，上到層頂、下接入口道路） ── -->
    <path d="M199,238 C224,232 248,232 271,238 C292,328 312,414 330,498
      C304,504 280,504 258,498 C240,414 218,328 199,238 Z" fill="#D0C9B6"/>

    <!-- ── 深綠：各層分隔坡崁／圍籬 ── -->
    <g fill="#7FB055">
      <!-- ① E 區 ↔ 停車場 -->
      <path d="M175,238 C183,235 191,235 199,238 C220,328 240,414 258,498
        C250,501 242,501 234,498 C216,414 194,328 175,238 Z"/>
      <!-- ② 停車場 ↔ D 區 -->
      <path d="M271,238 C279,235 287,235 295,238 C316,328 336,414 354,498
        C346,501 338,501 330,498 C312,414 290,328 271,238 Z"/>
      <!-- ③ D 區 ↔ C 區 -->
      <path d="M373,238 C381,235 389,235 397,238 C418,328 438,414 456,498
        C448,501 440,501 432,498 C414,414 392,328 373,238 Z"/>
      <!-- ④ C 區 ↔ 營本部／B 區 -->
      <path d="M479,238 C487,235 495,235 503,238 C524,328 544,414 562,498
        C554,501 546,501 538,498 C520,414 498,328 479,238 Z"/>
      <!-- ⑤ B 區 ↔ A 區 -->
      <path d="M585,238 C593,235 601,235 609,238 C630,328 650,414 668,498
        C660,501 652,501 644,498 C626,414 604,328 585,238 Z"/>
      <!-- 左緣坡崁 -->
      <path d="M74,196 C62,272 60,384 76,470 C88,490 104,488 108,466 C114,392 118,296 120,220
        C122,176 112,148 98,138 C84,148 77,168 74,196 Z"/>
      <!-- 上緣坡地（左）— 綠框① -->
      <path d="M76,186 C80,138 120,106 182,98 C218,94 250,92 280,92
        C286,140 284,196 280,244 C228,248 166,246 118,238 C94,232 78,212 76,186 Z"/>
      <!-- 上緣坡地（右）— 綠框② -->
      <path d="M540,102 C612,94 692,94 764,106 C786,144 794,182 790,220
        C718,212 636,210 558,216 C546,186 538,140 540,102 Z"/>
    </g>
    <!-- 右側林地（森林步道／樹林） -->
    <path d="M778,124 C824,136 866,156 884,192 C898,234 892,288 876,320 C894,360 892,418 870,458
      C848,494 808,516 762,522 C784,462 792,382 796,302 C800,220 796,158 778,124 Z" fill="#77A94F"/>

    <!-- 割草斜紋 -->
    <rect x="0" y="0" width="1182" height="642" fill="url(#mow)"/>

    <!-- ── 灰：最下方入口道路（橫貫，不進入任何一層） ── -->
    <path d="M24,498 C200,506 420,510 620,506 C692,504 728,500 750,492 L772,620 L6,620 Z" fill="#D0C9B6"/>

    <!-- ── 灰：各層由道路轉進來的一小段 ── -->
    <g fill="#D0C9B6">
      <!-- E 區依指示不留灰色空間，全為草地 -->
      <!-- D 層：填滿整層寬（貼齊兩側深綠帶） -->
      <path d="M341,438 L419,438 L433,500 L355,500 Z"/>
      <!-- C 層：填滿整層寬 -->
      <path d="M443,438 L525,438 L539,500 L457,500 Z"/>
      <!-- B 層 -->
      <path d="M580,440 C591,436 603,436 612,440 L617,500 L585,500 Z"/>
      <!-- A 層：貼齊深綠帶右緣 -->
      <path d="M654,438 L712,438 L726,500 L668,500 Z"/>
    </g>
  </g>

  <!-- 地界線 -->
  <use href="#land" fill="none" stroke="#8FB86A" stroke-width="2.5"/>

