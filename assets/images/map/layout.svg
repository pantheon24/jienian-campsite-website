  <!-- 景觀池依指示刪除 -->
  <!-- 小動物區：白色虛線步道（依原圖比例放大，位置移到 D 區正上方的開放草地層） -->
  <g fill="none" stroke="#F4EFE0" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="2 6.5">
    <path d="M336,196 C328,166 352,138 396,132 C444,124 486,134 500,158 C512,180 500,204 466,218
      C424,234 372,232 344,216 C338,212 336,204 336,196 Z"/>
    <path d="M352,190 C376,166 404,178 428,164 C450,152 470,152 484,160"/>
    <path d="M344,218 C340,232 336,240 332,240"/>
  </g>
