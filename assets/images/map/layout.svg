    <use href="#tree" x="778" y="496" width="30" height="36"/>
    <use href="#tree" x="760" y="516" width="30" height="36"/>
    <!-- 場內零星 -->
    <use href="#tree" x="240" y="150" width="28" height="34"/>
    <use href="#tree" x="150" y="150" width="28" height="34"/>
    <use href="#tree" x="120" y="440" width="26" height="32"/>
    <use href="#tree" x="360" y="430" width="26" height="32"/>
    <use href="#tree" x="470" y="360" width="26" height="32"/>
    <use href="#tree" x="640" y="180" width="26" height="32"/>
    <use href="#tree" x="700" y="270" width="26" height="32"/>
  </g>

  <!-- 插座／洗水槽水滴圖案依指示全數移除 -->

  <!-- ================= 廁所 ================= -->
  <use href="#toilet" x="276" y="188" width="30" height="33"/>
  <use href="#toilet" x="138" y="266" width="30" height="33"/>
  <use href="#toilet" x="690" y="214" width="30" height="33"/>
  <use href="#toilet" x="582" y="398" width="30" height="33"/>

  <!-- ================= 樓梯（跨深綠坡崁，供人上下層） ================= -->
  <use href="#stairs" x="277" y="300" width="28" height="28"/>
  <use href="#stairs" x="303" y="416" width="28" height="28"/>
  <use href="#stairs" x="405" y="330" width="28" height="28"/>
  <use href="#stairs" x="511" y="360" width="28" height="28"/>
  <use href="#stairs" x="613" y="392" width="28" height="28"/>

  <!-- ================= 停車 P（僅停車場一處） ================= -->
  <use href="#pp" x="248" y="366" width="28" height="28"/>

  <!-- ================= 指南針＋比例尺 ================= -->
  <use href="#compass" x="852" y="196" width="42" height="42"/>
  <text x="906" y="222" font-family="'Noto Sans TC',sans-serif" font-weight="700" font-size="17" fill="#4a4a44">東</text>
  <text x="852" y="566" font-family="'Noto Sans TC',sans-serif" font-size="13" fill="#5F8CA3">嘉義　水上</text>
  <text x="852" y="590" font-family="'Noto Sans TC',sans-serif" font-weight="700" font-size="17" fill="#4a4a44">海拔 90 公尺</text>

  <!-- ================= 入口 ================= -->
  <g>
    <rect x="30" y="536" width="72" height="30" rx="7" fill="#5B4636"/>
    <text x="66" y="557" text-anchor="middle" font-family="'Noto Serif TC',serif" font-weight="700" font-size="17" fill="#FDF7EC">入口</text>
    <path d="M108,551 L146,551 M140,544 L148,551 L140,558" fill="none" stroke="#5B4636" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ================= 粉紅標籤 ================= -->
  <g font-family="'Noto Sans TC',sans-serif" font-weight="700" fill="#FFFFFF">
    <g><rect x="122" y="388" width="66" height="32" rx="16" fill="#EA6A9C"/><text x="155" y="410" text-anchor="middle" font-size="17">E區</text></g>
    <g><rect x="332" y="384" width="66" height="32" rx="16" fill="#EA6A9C"/><text x="365" y="406" text-anchor="middle" font-size="17">D區</text></g>
    <g><rect x="447" y="444" width="66" height="32" rx="16" fill="#EA6A9C"/><text x="480" y="466" text-anchor="middle" font-size="17">C區</text></g>
    <g><rect x="595" y="544" width="66" height="32" rx="16" fill="#EA6A9C"/><text x="628" y="566" text-anchor="middle" font-size="17">B區</text></g>
    <g><rect x="635" y="294" width="76" height="32" rx="16" fill="#EA6A9C"/><text x="673" y="316" text-anchor="middle" font-size="17">A6區</text></g>
    <g><rect x="648" y="380" width="76" height="32" rx="16" fill="#EA6A9C"/><text x="686" y="402" text-anchor="middle" font-size="17">A1區</text></g>
    <g><rect x="712" y="422" width="76" height="32" rx="16" fill="#EA6A9C"/><text x="750" y="444" text-anchor="middle" font-size="17">A2區</text></g>
    <g><rect x="792" y="438" width="76" height="32" rx="16" fill="#EA6A9C"/><text x="830" y="460" text-anchor="middle" font-size="17">A5區</text></g>
    <g><rect x="828" y="390" width="104" height="32" rx="16" fill="#EA6A9C"/><text x="880" y="412" text-anchor="middle" font-size="17">森林步道</text></g>
    <g><rect x="762" y="504" width="62" height="30" rx="15" fill="#EA6A9C"/><text x="793" y="525" text-anchor="middle" font-size="16">樹林</text></g>
    <g><rect x="512" y="520" width="102" height="30" rx="15" fill="#EA6A9C"/><text x="563" y="541" text-anchor="middle" font-size="15">1F 營本部</text></g>
  </g>

  <!-- 描圖對位用（完成後連同上方 image 一起刪） -->
  <image id="traceTop" href="layout.png" x="0" y="0" width="1182" height="642" opacity="0"/>
</svg>
